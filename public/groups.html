<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعات واتساب</title>
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/groups.css">
</head>
<body>

<header id="app-header"></header>

<!-- Stats -->
<div class="stats">
  <div class="stat-card"><div class="sc-icon green">👥</div><div class="sc-body"><div class="num" id="sTotal">—</div><div class="lbl">إجمالي المجموعات</div></div></div>
  <div class="stat-card"><div class="sc-icon blue">👤</div><div class="sc-body"><div class="num" id="sMembers">—</div><div class="lbl">إجمالي الأعضاء</div></div></div>
  <div class="stat-card"><div class="sc-icon purple">🤖</div><div class="sc-body"><div class="num" id="sBotStatus">—</div><div class="lbl">ردود البوت في المجموعات</div></div></div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <input class="search-input" id="searchGroup" placeholder="🔍 ابحث باسم المجموعة...">
  <div class="toggle-wrap">
    <label for="toggleBot">🤖 رد تلقائي</label>
    <label class="switch">
      <input type="checkbox" id="toggleBot" onchange="toggleBotGroups({enabled:this.checked})">
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-wrap" id="mentionWrap" style="opacity:.5;pointer-events:none">
    <label for="toggleMention">@ عند الإشارة فقط</label>
    <label class="switch">
      <input type="checkbox" id="toggleMention" onchange="toggleBotGroups({mentionOnly:this.checked})">
      <span class="slider"></span>
    </label>
  </div>
  <button class="btn btn-purple" onclick="openBroadcast()">📢 إعلان للكل</button>
  <button class="btn btn-teal" onclick="load()">🔄 تحديث</button>
</div>

<!-- Groups -->
<div class="groups-wrap" id="groupsWrap">
  <div class="empty">⏳ جاري التحميل...</div>
</div>

<!-- Broadcast Modal -->
<div class="overlay" id="broadcastOverlay">
  <div class="modal" style="max-width:500px">
    <button class="modal-close" onclick="closeBroadcast()">✕</button>
    <h3>📢 إعلان لجميع المجموعات</h3>
    <label style="font-size:.78rem;color:var(--muted);font-weight:600;display:block;margin-bottom:5px">📝 نص الرسالة (اختياري مع صورة)</label>
    <textarea id="bcGrpMsg" style="min-height:90px" placeholder="اكتب نص الإعلان..."></textarea>
    <label style="font-size:.78rem;color:var(--muted);font-weight:600;display:block;margin:10px 0 5px">🖼 صورة مرفقة (اختياري)</label>
    <div id="bcGrpImgArea" style="border:2px dashed var(--border);border-radius:10px;padding:10px;text-align:center;cursor:pointer;position:relative" onclick="document.getElementById('bcGrpImgInput').click()">
      <input type="file" id="bcGrpImgInput" accept="image/*" style="display:none" onchange="previewGrpImg(this)">
      <div id="bcGrpImgPlaceholder" style="color:var(--muted);font-size:.82rem">📎 اضغط لإضافة صورة</div>
      <img id="bcGrpImgPreview" src="" style="display:none;max-height:130px;max-width:100%;border-radius:8px;object-fit:contain">
      <button id="bcGrpImgRemove" onclick="removeGrpImg(event)" style="display:none;position:absolute;top:6px;left:6px;background:#e53935;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px">✕</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.82rem;cursor:pointer">
      <input type="checkbox" id="bcGrpDry" style="width:15px;height:15px"> معاينة فقط (بدون إرسال)
    </label>
    <div id="bcGrpSpinner" style="display:none;text-align:center;padding:10px;color:var(--muted)">⏳ جاري الإرسال...</div>
    <div id="bcGrpResult" style="max-height:150px;overflow-y:auto;font-size:.78rem;padding:8px;background:#f8f9fa;border-radius:8px;margin-top:8px;display:none;white-space:pre-wrap;direction:ltr"></div>
    <div id="bcGrpSummary" style="display:none;gap:8px;margin-top:8px;flex-wrap:wrap">
      <span id="bcGrpSent"  style="background:#e8f5e9;color:#2e7d32;padding:4px 12px;border-radius:8px;font-size:.8rem;font-weight:700"></span>
      <span id="bcGrpFail"  style="background:#ffebee;color:#c62828;padding:4px 12px;border-radius:8px;font-size:.8rem;font-weight:700"></span>
      <span id="bcGrpTotal" style="background:#e3f2fd;color:#1565c0;padding:4px 12px;border-radius:8px;font-size:.8rem;font-weight:700"></span>
    </div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeBroadcast()">إغلاق</button>
      <button class="mbtn" id="bcGrpStopBtn" onclick="stopGrpBroadcast()" style="display:none;background:#e53935;color:#fff">⏹ وقف</button>
      <button class="mbtn mbtn-green" id="bcGrpSendBtn" onclick="runGrpBroadcast()">📢 إرسال للكل</button>
    </div>
  </div>
</div>

<!-- Chat View Modal -->
<div class="overlay" id="chatOverlay">
  <div class="chat-modal">
    <div class="chat-hdr">
      <div>
        <div class="ch-name" id="chatTitle">—</div>
        <div class="ch-count" id="chatSubtitle"></div>
      </div>
      <button onclick="closeChat()">✕</button>
    </div>
    <div class="chat-toolbar">
      <select id="msgLimit" onchange="reloadChat()">
        <option value="30">30 رسالة</option>
        <option value="50" selected>50 رسالة</option>
        <option value="100">100 رسالة</option>
        <option value="200">200 رسالة</option>
      </select>
      <button onclick="reloadChat()">🔄 تحديث</button>
    </div>
    <div class="msgs-wrap" id="msgsWrap">
      <div class="chat-spinner">⏳ جاري التحميل...</div>
    </div>
    <div class="chat-input-bar">
      <textarea id="chatSendMsg" placeholder="اكتب رسالة للمجموعة..." rows="1"></textarea>
      <button onclick="sendFromChat()">➤</button>
    </div>
  </div>
</div>

<!-- Send Modal -->
<div class="overlay" id="sendOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeSend()">✕</button>
    <h3>📤 إرسال رسالة للمجموعة</h3>
    <div id="sendGroupName" style="font-size:.85rem;color:var(--muted);margin-bottom:12px;font-weight:600"></div>
    <textarea id="sendMsg" placeholder="اكتب الرسالة..."></textarea>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeSend()">إلغاء</button>
      <button class="mbtn mbtn-green" onclick="doSend()">📤 إرسال</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<footer id="app-footer"></footer>
<script src="/js/nav.js"></script>
<script src="/js/groups.js"></script>
</body>
</html>
