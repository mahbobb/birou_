<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز شقة — Abrajeimmo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f4f8;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #1a3c5e 0%, #2563a8 100%);
      color: #fff;
      padding: 28px 28px 22px;
      text-align: center;
    }
    .card-header h1 { font-size: 1.45rem; margin-bottom: 6px; }
    .card-header p  { font-size: 0.88rem; opacity: .85; }
    .card-header .logo { font-size: 2rem; margin-bottom: 8px; }

    .card-body { padding: 28px; }

    .form-row { display: flex; gap: 14px; }
    .form-row .field { flex: 1; }

    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.83rem; color: #555; margin-bottom: 6px; font-weight: 600; }
    input, select, textarea {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #dde3ec;
      border-radius: 10px;
      font-size: 0.92rem;
      color: #333;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
      background: #fafbfc;
    }
    input:focus, select:focus, textarea:focus { border-color: #2563a8; background: #fff; }
    textarea { min-height: 90px; resize: vertical; }

    .counter-row { display: flex; gap: 14px; }
    .counter-box { flex: 1; border: 1.5px solid #dde3ec; border-radius: 10px; padding: 10px 14px; background: #fafbfc; display: flex; align-items: center; justify-content: space-between; }
    .counter-box label { margin: 0; font-size: 0.82rem; }
    .counter-ctrl { display: flex; align-items: center; gap: 10px; }
    .counter-btn { width: 30px; height: 30px; border: 1.5px solid #dde3ec; border-radius: 50%; background: #fff; color: #2563a8; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; font-weight: 700; }
    .counter-btn:hover { background: #e8f0fb; }
    .counter-val { min-width: 24px; text-align: center; font-weight: 700; font-size: 0.95rem; color: #1a3c5e; }

    .nights-badge { text-align: center; font-size: 0.82rem; color: #2563a8; margin-bottom: 16px; font-weight: 600; min-height: 20px; }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, #1a3c5e, #2563a8);
      color: #fff; border: none; border-radius: 12px;
      padding: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover:not(:disabled) { opacity: .9; }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; }

    /* Success screen */
    .success-screen { display: none; text-align: center; padding: 40px 28px; }
    .success-screen.show { display: block; }
    .success-icon { font-size: 3.5rem; margin-bottom: 14px; }
    .success-screen h2 { color: #1a3c5e; font-size: 1.3rem; margin-bottom: 8px; }
    .success-screen p  { color: #666; font-size: 0.9rem; line-height: 1.6; }
    .success-screen .ref { display: inline-block; background: #e8f0fb; color: #2563a8; border-radius: 8px; padding: 4px 14px; font-weight: 700; margin-top: 12px; font-size: 0.88rem; }

    /* Error */
    .err-msg { background: #fff0f0; border: 1px solid #fca5a5; border-radius: 8px; padding: 10px 14px; color: #b91c1c; font-size: 0.85rem; margin-bottom: 14px; display: none; }
    .err-msg.show { display: block; }

    /* Upload buttons */
    .upload-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .ubtn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 18px; border-radius: 10px; font-size: .88rem;
      font-weight: 600; cursor: pointer; border: 1.5px solid; transition: all .15s;
      font-family: inherit;
    }
    .ubtn-camera  { background: #1a3c5e; color: #fff; border-color: #1a3c5e; }
    .ubtn-camera:hover  { background: #0f2840; }
    .ubtn-gallery { background: #fff; color: #1a3c5e; border-color: #1a3c5e; }
    .ubtn-gallery:hover { background: #f0f5ff; }
    .upload-drop {
      flex: 1; min-width: 160px; border: 2px dashed #c8d3dd; border-radius: 10px;
      padding: 10px 14px; color: #999; font-size: .8rem; cursor: default;
      display: flex; align-items: center; gap: 6px; transition: border-color .2s, background .2s;
      background: #fafbfc;
    }
    .upload-drop.drag { border-color: #2563a8; background: #f0f5ff; color: #2563a8; }
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 12px; width: 100%; }
    .prev-item { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
    .prev-item img { width: 100%; height: 100%; object-fit: cover; }
    .prev-del { position:absolute; top:4px; left:4px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:22px; height:22px; font-size:.75rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }

    .card-footer { padding: 14px 28px 20px; text-align: center; font-size: 0.78rem; color: #aaa; border-top: 1px solid #f0f0f0; }
    .card-footer a { color: #2563a8; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">🏢</div>
    <h1>طلب حجز شقة</h1>
    <p>أبراج إيمو — Abrajeimmo.com</p>
  </div>

  <div class="card-body" id="formWrap">
    <div class="err-msg" id="errMsg"></div>

    <div class="field">
      <label>الاسم الكامل *</label>
      <input type="text" id="fName" placeholder="مثال: محمد أمين" autocomplete="name">
    </div>

    <div class="field">
      <label>رقم الهاتف (واتساب) *</label>
      <input type="tel" id="fPhone" placeholder="0600000000" autocomplete="tel">
    </div>

    <div class="field">
      <label>الشقة المطلوبة</label>
      <input type="text" id="fApartment" placeholder="مثال: شقة رقم 12 — برج الياسمين">
    </div>

    <div class="form-row">
      <div class="field">
        <label>تاريخ الدخول *</label>
        <input type="date" id="fCheckIn">
      </div>
      <div class="field">
        <label>تاريخ الخروج *</label>
        <input type="date" id="fCheckOut">
      </div>
    </div>

    <div class="nights-badge" id="nightsBadge"></div>

    <div class="field">
      <label>عدد الأشخاص</label>
      <div class="counter-row">
        <div class="counter-box">
          <label>بالغين</label>
          <div class="counter-ctrl">
            <button class="counter-btn" onclick="changeCount('adults',-1)">−</button>
            <span class="counter-val" id="adultsVal">1</span>
            <button class="counter-btn" onclick="changeCount('adults',1)">+</button>
          </div>
        </div>
        <div class="counter-box">
          <label>أطفال</label>
          <div class="counter-ctrl">
            <button class="counter-btn" onclick="changeCount('children',-1)">−</button>
            <span class="counter-val" id="childrenVal">0</span>
            <button class="counter-btn" onclick="changeCount('children',1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label>ملاحظات إضافية</label>
      <textarea id="fMessage" placeholder="أي تفاصيل أو متطلبات خاصة..."></textarea>
    </div>

    <!-- ID Card Upload -->
    <div class="field">
      <label>صور البطاقة الوطنية (اختياري — حتى 4 صور)</label>

      <!-- hidden inputs -->
      <input type="file" id="fIdImages" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
      <input type="file" id="fCamera"   accept="image/*" capture="environment" style="display:none" onchange="handleFiles(this.files)">

      <!-- action buttons -->
      <div class="upload-btns" id="uploadBtns">
        <button type="button" class="ubtn ubtn-camera" onclick="document.getElementById('fCamera').click()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 15.2A3.2 3.2 0 1 1 15.2 12 3.2 3.2 0 0 1 12 15.2M20 4h-3.17L15 2H9L7.17 4H4A2 2 0 0 0 2 6V18A2 2 0 0 0 4 20H20A2 2 0 0 0 22 18V6A2 2 0 0 0 20 4Z"/></svg>
          التقاط بالكاميرا
        </button>
        <button type="button" class="ubtn ubtn-gallery" onclick="document.getElementById('fIdImages').click()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8.5 13.5L11 16.5L14.5 12L19 18H5M21 19V5A2 2 0 0 0 19 3H5A2 2 0 0 0 3 5V19A2 2 0 0 0 5 21H19A2 2 0 0 0 21 19Z"/></svg>
          من المعرض
        </button>
        <div class="upload-drop" id="uploadDrop" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
          أو اسحب الصور هنا
        </div>
      </div>

      <!-- preview -->
      <div id="previewGrid" class="preview-grid" style="display:none"></div>
      <div id="imgCounter" style="font-size:.75rem;color:#888;margin-top:6px;display:none"></div>
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="submitBooking()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      إرسال طلب الحجز
    </button>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-icon">✅</div>
    <h2>تم إرسال طلب الحجز!</h2>
    <p>شكراً لك، سنتواصل معك قريباً على واتساب للتأكيد.</p>
    <div class="ref" id="bookingRef">رقم الطلب: —</div>
    <br><br>
    <button class="btn-submit" style="max-width:200px;margin:auto" onclick="resetForm()">حجز جديد</button>
  </div>

  <div class="card-footer">
    <a href="https://abrajeimmo.com" target="_parent">abrajeimmo.com</a> — جميع الحقوق محفوظة
  </div>
</div>

<script>
const counts = { adults: 1, children: 0 };
let selectedFiles = [];

function handleFiles(fileList) {
  const newFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  for (const f of newFiles) {
    if (selectedFiles.length >= 4) break;
    selectedFiles.push(f);
  }
  renderPreviews();
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag');
  handleFiles(e.dataTransfer.files);
}

function renderPreviews() {
  const grid    = document.getElementById('previewGrid');
  const counter = document.getElementById('imgCounter');
  if (!selectedFiles.length) {
    grid.style.display = 'none';
    counter.style.display = 'none';
    return;
  }
  grid.style.display = '';
  counter.style.display = '';
  counter.textContent = `${selectedFiles.length} / 4 صور`;
  grid.innerHTML = selectedFiles.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="prev-item"><img src="${url}"><button class="prev-del" onclick="removeFile(${i})">✕</button></div>`;
  }).join('');
  if (selectedFiles.length < 4) {
    grid.innerHTML += `
      <div class="prev-item" style="border:2px dashed #c8d3dd;border-radius:8px;background:#fafbfc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer" onclick="document.getElementById('fIdImages').click()">
        <span style="font-size:1.4rem;color:#aaa">+</span>
        <span style="font-size:.65rem;color:#bbb">إضافة</span>
      </div>`;
  }
}

function removeFile(i) {
  selectedFiles.splice(i, 1);
  renderPreviews();
}

function changeCount(field, delta) {
  counts[field] = Math.max(field === 'adults' ? 1 : 0, counts[field] + delta);
  document.getElementById(field + 'Val').textContent = counts[field];
}

// حساب عدد الليالي
document.getElementById('fCheckIn').addEventListener('change', updateNights);
document.getElementById('fCheckOut').addEventListener('change', updateNights);

// تعيين الحد الأدنى للتاريخ = اليوم
const today = new Date().toISOString().split('T')[0];
document.getElementById('fCheckIn').min  = today;
document.getElementById('fCheckOut').min = today;

function updateNights() {
  const ci = document.getElementById('fCheckIn').value;
  const co = document.getElementById('fCheckOut').value;
  const badge = document.getElementById('nightsBadge');
  if (ci && co) {
    const nights = Math.ceil((new Date(co) - new Date(ci)) / 86400000);
    if (nights > 0) badge.textContent = `🌙 ${nights} ليلة`;
    else { badge.textContent = '⚠️ تاريخ الخروج يجب أن يكون بعد تاريخ الدخول'; }
  } else { badge.textContent = ''; }
}

async function submitBooking() {
  const name      = document.getElementById('fName').value.trim();
  const phone     = document.getElementById('fPhone').value.trim();
  const apartment = document.getElementById('fApartment').value.trim();
  const check_in  = document.getElementById('fCheckIn').value;
  const check_out = document.getElementById('fCheckOut').value;
  const message   = document.getElementById('fMessage').value.trim();
  const errEl     = document.getElementById('errMsg');

  errEl.classList.remove('show');

  if (!name || !phone || !check_in || !check_out) {
    errEl.textContent = '⚠️ يرجى ملء الحقول المطلوبة: الاسم، الهاتف، تواريخ الحجز';
    errEl.classList.add('show');
    return;
  }
  const nights = Math.ceil((new Date(check_out) - new Date(check_in)) / 86400000);
  if (nights <= 0) {
    errEl.textContent = '⚠️ تاريخ الخروج يجب أن يكون بعد تاريخ الدخول';
    errEl.classList.add('show');
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z" opacity=".3"/><path d="M12 2v4a8 8 0 0 1 8 8h4A12 12 0 0 0 12 2z"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></path></svg> جاري الإرسال...';

  try {
    const apiBase = window.BOOKING_API_URL || (window.location.origin + '/api/bookings');
    const fd = new FormData();
    fd.append('name', name); fd.append('phone', phone);
    fd.append('apartment', apartment); fd.append('check_in', check_in);
    fd.append('check_out', check_out); fd.append('adults', counts.adults);
    fd.append('children', counts.children); fd.append('message', message);
    fd.append('source', 'abrajeimmo');
    selectedFiles.forEach(f => fd.append('id_images', f));
    const res  = await fetch(apiBase, { method: 'POST', body: fd });
    let data = {};
    try { data = await res.json(); } catch { data = { error: `HTTP ${res.status}` }; }

    if (!res.ok || data.error) {
      errEl.textContent = '❌ ' + (data.error || `خطأ ${res.status}`);
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> إرسال طلب الحجز';
      return;
    }

    document.getElementById('bookingRef').textContent = 'رقم الطلب: #' + data.id;
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successScreen').classList.add('show');
  } catch (err) {
    errEl.textContent = '❌ ' + (err.message || 'خطأ في الاتصال، تأكد من الإنترنت وحاول مجدداً');
    errEl.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> إرسال طلب الحجز';
  }
}

function resetForm() {
  document.getElementById('formWrap').style.display = 'block';
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('fName').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fApartment').value = '';
  document.getElementById('fCheckIn').value = '';
  document.getElementById('fCheckOut').value = '';
  document.getElementById('fMessage').value = '';
  document.getElementById('nightsBadge').textContent = '';
  counts.adults = 1; counts.children = 0;
  document.getElementById('adultsVal').textContent = '1';
  document.getElementById('childrenVal').textContent = '0';
  document.getElementById('btnSubmit').disabled = false;
  document.getElementById('btnSubmit').innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> إرسال طلب الحجز';
}
</script>
</body>
</html>
