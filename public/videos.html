<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفيديوهات — واتساب بوت</title>
  <style>
    :root {
      --green:  #25d366;
      --teal:   #128c7e;
      --dark:   #075e54;
      --red:    #e53935;
      --blue:   #1976d2;
      --orange: #ff9800;
      --bg:     #f0f2f5;
      --card:   #ffffff;
      --border: #e8edf2;
      --text:   #1a1a2e;
      --muted:  #8696a0;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--dark), var(--teal));
      color: white; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 16px rgba(0,0,0,0.18); position: sticky; top: 0; z-index: 50; height: 60px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { width: 38px; height: 38px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.82rem; padding: 5px 10px; border-radius: 8px; transition: all 0.2s; white-space: nowrap; }
    .nav-links a:hover { background: rgba(255,255,255,0.15); color: white; }
    .nav-links a.active { background: rgba(255,255,255,0.22); color: white; font-weight: 600; }

    /* Stats */
    .stats-row { display: flex; gap: 14px; padding: 20px 24px 0; flex-wrap: wrap; }
    .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; flex: 1; min-width: 130px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); transition: transform 0.15s; }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .stat-icon.green { background: #e8f5e9; }
    .stat-icon.teal  { background: #e0f2f1; }
    .stat-icon.red   { background: #ffebee; }
    .stat-body .num  { font-size: 1.7rem; font-weight: 800; line-height: 1; color: var(--dark); }
    .stat-body .lbl  { font-size: 0.76rem; color: var(--muted); margin-top: 3px; }
    #selCard         { display: none; }
    #selCard .stat-body .num { color: var(--red); }

    /* Toolbar */
    .toolbar { padding: 16px 24px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-wrap .search-ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search-input { width: 100%; padding: 9px 36px 9px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.9rem; outline: none; direction: rtl; background: var(--card); transition: border-color 0.2s; color: var(--text); }
    .search-input:focus { border-color: var(--teal); }
    .tbtn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.83rem; font-weight: 600; transition: all 0.18s; white-space: nowrap; }
    .tbtn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .tbtn-teal   { background: var(--teal);   color: white; }
    .tbtn-green  { background: var(--green);  color: white; }
    .tbtn-orange { background: var(--orange); color: white; }
    .tbtn-red    { background: var(--red);    color: white; }
    .tbtn-gray   { background: #ccc;          color: #333;  }
    #bulkDelBtn  { display: none; }

    /* Gallery */
    .gallery-wrap { padding: 8px 24px 40px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }

    /* Video Card */
    .vid-card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1.5px solid var(--border); transition: box-shadow 0.2s, border-color 0.2s; position: relative; }
    .vid-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
    .vid-card.selected { border-color: var(--red); box-shadow: 0 0 0 3px rgba(229,57,53,0.12); }
    .vid-card.playing-now { border-color: var(--green); box-shadow: 0 0 0 3px rgba(37,211,102,0.18); }
    .vid-card.already-played { opacity: 0.55; }

    /* Checkbox */
    .card-cb { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; background: rgba(255,255,255,0.9); border: 2px solid #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; font-size: 0.85rem; color: white; transition: all 0.15s; backdrop-filter: blur(4px); }
    .vid-card.selected .card-cb { background: var(--red); border-color: var(--red); }
    .vid-card.selected .card-cb::after { content: "✓"; }

    /* Video element */
    .vid-card video { width: 100%; max-height: 210px; background: #111; display: block; object-fit: cover; }

    /* Card info */
    .vid-info { padding: 12px 14px 14px; }
    .vid-sender { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .vid-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .phone-tag { background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; }
    .vid-time { font-size: 0.75rem; color: var(--muted); }
    .vid-size { font-size: 0.73rem; color: #bbb; }
    .vid-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .vbtn { padding: 5px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.78rem; font-weight: 600; transition: all 0.18s; display: inline-flex; align-items: center; gap: 4px; }
    .vbtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .vbtn.dl  { background: #e0f2f1; color: var(--dark); text-decoration: none; }
    .vbtn.rep { background: #e3f2fd; color: var(--blue); }
    .vbtn.del { background: #ffebee; color: var(--red);  }
    .note-wrap { display: flex; gap: 6px; align-items: center; }
    .note-input { flex: 1; padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.82rem; direction: rtl; outline: none; font-family: inherit; background: #fafafa; color: var(--text); transition: border-color 0.2s; }
    .note-input:focus { border-color: var(--teal); background: white; }
    .note-save-btn { padding: 5px 14px; background: var(--teal); color: white; border: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; flex-shrink: 0; }
    .note-save-btn:hover { opacity: 0.85; }

    /* Play All button state */
    #playAllBtn.playing { background: var(--red); animation: recPulse 1.2s ease-in-out infinite; }
    @keyframes recPulse {
      0%,100% { box-shadow: 0 2px 8px rgba(229,57,53,0.3); }
      50%      { box-shadow: 0 4px 18px rgba(229,57,53,0.6); }
    }

    /* Empty */
    .empty { text-align: center; padding: 70px 20px; color: var(--muted); background: var(--card); border-radius: var(--radius); border: 1.5px dashed var(--border); grid-column: 1/-1; }
    .empty .empty-icon { font-size: 3rem; opacity: 0.4; margin-bottom: 12px; }

    /* Modal overlay */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
    .overlay.open { display: flex; }
    .modal { background: white; border-radius: 18px; padding: 28px; width: 92%; max-width: 500px; box-shadow: 0 16px 48px rgba(0,0,0,0.22); max-height: 92vh; overflow-y: auto; animation: modalIn 0.22s ease; }
    @keyframes modalIn { from { transform: scale(0.95) translateY(16px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-header h3 { font-size: 1.05rem; color: var(--dark); font-weight: 700; }
    .modal-close { background: #f0f2f5; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .modal-close:hover { background: #e0e0e0; }
    .to-info { background: #f0f2f5; border-radius: 10px; padding: 9px 14px; margin-bottom: 14px; font-size: 0.84rem; color: #555; border-right: 3px solid var(--teal); }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; background: #f0f2f5; border-radius: 10px; padding: 4px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: 0.88rem; font-weight: 600; transition: all 0.18s; color: var(--muted); }
    .tab-btn.active { background: white; color: var(--dark); box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .modal textarea { width: 100%; height: 110px; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.9rem; resize: vertical; outline: none; direction: rtl; font-family: inherit; transition: border-color 0.2s; }
    .modal textarea:focus { border-color: var(--teal); }
    .voice-upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .voice-upload-area:hover { border-color: var(--teal); background: #f0fdf4; }
    .or-sep { text-align: center; color: #ccc; font-size: 0.82rem; margin: 10px 0; }
    .btn-record { background: linear-gradient(135deg, var(--teal), var(--dark)); color: white; padding: 10px 24px; border: none; border-radius: 50px; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-record:hover { transform: translateY(-1px); }
    .btn-record.recording { background: linear-gradient(135deg, var(--red), #c62828); }
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
    .mbtn { padding: 9px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.88rem; font-weight: 600; transition: all 0.18s; }
    .mbtn:hover { filter: brightness(1.08); }
    .mbtn-cancel { background: #f0f2f5; color: #555; }
    .mbtn-green  { background: var(--green); color: white; }

    /* Upload modal */
    #uploadOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
    #uploadOverlay.open { display: flex; }
    .upload-modal { background: white; border-radius: 18px; padding: 28px; width: 92%; max-width: 520px; box-shadow: 0 16px 48px rgba(0,0,0,0.22); animation: modalIn 0.22s ease; }
    .upload-modal h3 { font-size: 1.05rem; color: var(--dark); margin-bottom: 16px; font-weight: 700; }
    .upload-modal label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 4px; margin-top: 10px; }
    .upload-modal input[type=text], .upload-modal input[type=tel] { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.88rem; outline: none; direction: rtl; transition: border-color 0.2s; }
    .upload-modal input:focus { border-color: var(--teal); }
    .drop-zone { border: 2px dashed var(--border); border-radius: 14px; padding: 28px 20px; text-align: center; cursor: pointer; margin-top: 12px; color: var(--muted); background: #fafafa; transition: all 0.2s; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: var(--teal); background: #f0fdf4; color: var(--teal); }
    .drop-zone .dz-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .upload-preview { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 180px; overflow-y: auto; }
    .up-item { display: flex; align-items: center; gap: 10px; background: #f8f9fa; border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; border: 1px solid var(--border); }
    .up-item .up-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .up-item .up-size { color: var(--muted); font-size: 0.74rem; flex-shrink: 0; }
    .up-item .rm { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1rem; padding: 0 4px; flex-shrink: 0; }
    .up-progress { margin-top: 10px; font-size: 0.82rem; color: var(--teal); display: none; }

    /* Toast */
    #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(26,26,46,0.92); color: white; padding: 11px 24px; border-radius: 50px; font-size: 0.88rem; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 999; backdrop-filter: blur(8px); white-space: nowrap; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Responsive */
    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 16px; height: auto; }
      .stats-row, .toolbar, .gallery-wrap { padding-left: 16px; padding-right: 16px; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header id="app-header"></header>

<!-- Stats -->
<div class="stats-row">
  <div class="stat-card">
    <div class="stat-icon green">🎬</div>
    <div class="stat-body"><div class="num" id="sTotal">—</div><div class="lbl">إجمالي الفيديوهات</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon teal">📅</div>
    <div class="stat-body"><div class="num" id="sToday">—</div><div class="lbl">اليوم</div></div>
  </div>
  <div class="stat-card" id="selCard">
    <div class="stat-icon red">☑️</div>
    <div class="stat-body"><div class="num" id="sSelected">0</div><div class="lbl">محددة</div></div>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input class="search-input" id="searchPhone" type="text" placeholder="ابحث برقم أو اسم أو تعليق...">
  </div>
  <button class="tbtn tbtn-teal"   onclick="toggleSelectAll()">☑️ تحديد الكل</button>
  <button class="tbtn tbtn-orange" onclick="openUploadModal()">⬆️ رفع فيديو</button>
  <button class="tbtn tbtn-green"  id="playAllBtn" onclick="togglePlayAll()">▶️ تشغيل الكل</button>
  <button class="tbtn tbtn-gray"   onclick="load(true)">🔄</button>
  <button class="tbtn tbtn-red"    id="bulkDelBtn" onclick="deleteSelected()">🗑️ حذف المحدد (<span id="selCount">0</span>)</button>
</div>

<!-- Gallery -->
<div class="gallery-wrap">
  <div class="gallery" id="gallery">
    <div class="empty"><div class="empty-icon">🎬</div><p>جاري التحميل...</p></div>
  </div>
</div>

<!-- Reply Modal -->
<div class="overlay" id="replyOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>💬 رد على الزبون</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="to-info" id="replyTo"></div>
    <div class="tab-bar">
      <button class="tab-btn active" id="tabText"  onclick="switchTab('text')">📝 نص</button>
      <button class="tab-btn"        id="tabVoice" onclick="switchTab('voice')">🎤 صوت</button>
    </div>
    <div class="tab-panel active" id="panelText">
      <textarea id="replyText" placeholder="اكتب ردك هنا..."></textarea>
    </div>
    <div class="tab-panel" id="panelVoice">
      <div style="text-align:center;margin-bottom:8px">
        <button id="recordBtn" class="btn-record" onclick="toggleRecord()">🎙️ ابدأ التسجيل</button>
        <div id="recordTimer" style="display:none;margin-top:6px;color:var(--red);font-weight:700">⏺️ <span id="timerDisplay">0:00</span></div>
      </div>
      <div class="or-sep">— أو اختر ملف —</div>
      <div class="voice-upload-area" onclick="document.getElementById('voiceFileInput').click()">
        <div style="font-size:1.8rem">🎵</div>
        <p style="font-size:0.83rem;margin-top:4px;color:var(--muted)">mp3 · ogg · wav · m4a</p>
      </div>
      <input type="file" id="voiceFileInput" accept="audio/*" style="display:none">
      <audio id="voicePreview" controls style="display:none;margin-top:12px;width:100%;"></audio>
      <div id="voiceName" style="font-size:0.78rem;color:var(--muted);margin-top:4px;text-align:center;"></div>
    </div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">إلغاء</button>
      <button class="mbtn mbtn-green"  onclick="sendReply()">✉️ إرسال</button>
    </div>
  </div>
</div>

<!-- Upload Modal -->
<div id="uploadOverlay">
  <div class="upload-modal">
    <h3>📤 رفع فيديو يدوياً</h3>
    <label>رقم الهاتف (اختياري)</label>
    <input type="tel" id="upPhone" placeholder="212600123456" dir="ltr">
    <label>اسم (اختياري)</label>
    <input type="text" id="upName" placeholder="يدوي">
    <div class="drop-zone" id="upDropZone" onclick="document.getElementById('uploadFileInput').click()">
      <div class="dz-icon">🎬</div>
      <p style="font-size:0.83rem;margin-top:5px">اسحب الفيديوهات هنا أو اضغط للاختيار</p>
      <small style="color:#bbb">mp4 · webm · mov · avi · mkv</small>
    </div>
    <input type="file" id="uploadFileInput" accept="video/*" multiple style="display:none">
    <div class="upload-preview" id="upPreview"></div>
    <div class="up-progress" id="upProgress">⏳ جاري الرفع...</div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeUploadModal()">إلغاء</button>
      <button class="mbtn mbtn-green"  id="upSendBtn" onclick="doUpload()">📤 رفع (<span id="upCount">0</span>)</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  /* ── State ── */
  let allVideos     = [];
  let selectedIds   = new Set();
  let upFiles       = [];
  let replyPhone    = "";
  let activeTab     = "text";
  let voiceData     = null, voiceMime = null;
  let mediaRecorder = null, recordChunks = [], recordInterval = null, recordSeconds = 0;
  let playAllActive = false;
  let playAllIdx    = -1;

  /* ── Detect if any video is playing ── */
  function isAnyVideoPlaying() {
    return [...document.querySelectorAll("video")].some(v => !v.paused);
  }

  /* ── Stats ── */
  async function loadStats() {
    try {
      const s = await fetch("/api/videos/stats").then(r => r.json());
      document.getElementById("sTotal").textContent = s.total;
      document.getElementById("sToday").textContent = s.today;
    } catch {}
  }

  /* ── Load ── */
  async function load(force = false) {
    if (!force && (isAnyVideoPlaying() || playAllActive)) return;
    const q = document.getElementById("searchPhone").value.trim();
    let url = "/api/videos?limit=200";
    if (q) url += /^\d+$/.test(q) ? `&phone=${encodeURIComponent(q)}` : `&search=${encodeURIComponent(q)}`;
    try {
      allVideos = await fetch(url).then(r => r.json());
      selectedIds.clear();
      updateSelUI();
      renderGallery(allVideos);
    } catch { showToast("❌ خطأ في تحميل الفيديوهات"); }
  }

  /* ── Render ── */
  function renderGallery(list) {
    const g = document.getElementById("gallery");
    if (!list.length) {
      g.innerHTML = `<div class="empty"><div class="empty-icon">🎬</div><p>لا توجد فيديوهات</p></div>`;
      return;
    }
    g.innerHTML = list.map(v => {
      const src  = `/uploads/videos/${v.filename}`;
      const time = new Date(v.created_at).toLocaleString("ar-MA");
      const mb   = (v.filesize / (1024 * 1024)).toFixed(2);
      const note = v.note ? escHtml(v.note) : "";
      const sel  = selectedIds.has(v.id) ? " selected" : "";
      return `
        <div class="vid-card${sel}" id="vc-${v.id}">
          <div class="card-cb" onclick="toggleCard(${v.id})"></div>
          <video src="${src}" controls preload="none" poster=""></video>
          <div class="vid-info">
            <div class="vid-sender">${escHtml(v.name)}</div>
            <div class="vid-meta">
              <span class="phone-tag">+${v.phone}</span>
              <span class="vid-time">${time}</span>
              <span class="vid-size">${mb} MB</span>
            </div>
            <div class="vid-actions">
              <a href="${src}" download="${v.filename}" class="vbtn dl">⬇️ تحميل</a>
              <button class="vbtn rep" onclick="openReply('${v.phone}','${escHtml(v.name)}')">↩️ رد</button>
              <button class="vbtn del" onclick="deleteSingle(${v.id})">🗑️ حذف</button>
            </div>
            <div class="note-wrap">
              <input class="note-input" id="note-${v.id}" type="text" placeholder="📝 تعليق للبحث لاحقاً..." value="${note}"
                     onkeydown="if(event.key==='Enter') saveNote(${v.id})">
              <button class="note-save-btn" onclick="saveNote(${v.id})">حفظ</button>
            </div>
          </div>
        </div>`;
    }).join("");
  }

  /* ── Play All ── */
  function togglePlayAll() {
    if (playAllActive) stopPlayAll();
    else startPlayAll();
  }

  function startPlayAll() {
    const videos = document.querySelectorAll(".vid-card video");
    if (!videos.length) return showToast("⚠️ لا توجد فيديوهات للتشغيل");
    playAllActive = true;
    playAllIdx = 0;
    const btn = document.getElementById("playAllBtn");
    btn.textContent = "⏹️ وقف التشغيل";
    btn.classList.add("playing");
    showToast(`▶️ تشغيل ${videos.length} فيديو...`);
    playNextVideo(videos, 0);
  }

  function playNextVideo(videos, idx) {
    if (!playAllActive || idx >= videos.length) {
      stopPlayAll();
      if (idx >= videos.length) showToast("✅ انتهى تشغيل كل الفيديوهات");
      return;
    }
    playAllIdx = idx;

    // إزالة تمييز السابق
    document.querySelectorAll(".vid-card.playing-now").forEach(c => {
      c.classList.remove("playing-now");
      c.classList.add("already-played");
    });

    const video = videos[idx];
    const card  = video.closest(".vid-card");
    if (card) {
      card.classList.add("playing-now");
      card.classList.remove("already-played");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    video.currentTime = 0;
    video.play().catch(() => {});

    video.onended = () => {
      if (!playAllActive) return;
      setTimeout(() => playNextVideo(videos, idx + 1), 800);
    };

    // تحديث العداد في الإحصائيات
    document.getElementById("sTotal").textContent = `${idx + 1}/${videos.length}`;
  }

  function stopPlayAll() {
    playAllActive = false;
    playAllIdx = -1;

    document.querySelectorAll(".vid-card video").forEach(v => {
      v.pause();
      v.onended = null;
    });

    document.querySelectorAll(".vid-card.playing-now, .vid-card.already-played").forEach(c => {
      c.classList.remove("playing-now", "already-played");
    });

    const btn = document.getElementById("playAllBtn");
    btn.textContent = "▶️ تشغيل الكل";
    btn.classList.remove("playing");

    loadStats();
  }

  /* ── Selection ── */
  function toggleCard(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    document.getElementById(`vc-${id}`)?.classList.toggle("selected", selectedIds.has(id));
    updateSelUI();
  }

  function toggleSelectAll() {
    if (selectedIds.size === allVideos.length && allVideos.length > 0) {
      selectedIds.clear();
    } else {
      allVideos.forEach(v => selectedIds.add(v.id));
    }
    updateSelUI();
    document.querySelectorAll(".vid-card").forEach(card => {
      const id = parseInt(card.id.replace("vc-", ""));
      card.classList.toggle("selected", selectedIds.has(id));
    });
  }

  function updateSelUI() {
    const n = selectedIds.size;
    document.getElementById("sSelected").textContent = n;
    document.getElementById("selCount").textContent  = n;
    document.getElementById("selCard").style.display    = n ? "flex" : "none";
    document.getElementById("bulkDelBtn").style.display = n ? "inline-flex" : "none";
  }

  /* ── Delete ── */
  async function deleteSingle(id) {
    if (!confirm("حذف هذا الفيديو نهائياً؟")) return;
    try {
      const r = await fetch(`/api/videos/${id}`, { method: "DELETE" });
      if ((await r.json()).ok) {
        document.getElementById(`vc-${id}`)?.remove();
        selectedIds.delete(id); updateSelUI();
        showToast("✅ تم الحذف"); loadStats();
      }
    } catch { showToast("❌ خطأ في الاتصال"); }
  }

  async function deleteSelected() {
    if (!selectedIds.size) return;
    if (!confirm(`حذف ${selectedIds.size} فيديو نهائياً؟`)) return;
    let done = 0;
    for (const id of [...selectedIds]) {
      try {
        const r = await fetch(`/api/videos/${id}`, { method: "DELETE" });
        if ((await r.json()).ok) { document.getElementById(`vc-${id}`)?.remove(); done++; }
      } catch {}
    }
    selectedIds.clear(); updateSelUI();
    showToast(`✅ تم حذف ${done} فيديو`); loadStats();
  }

  /* ── Note ── */
  async function saveNote(id) {
    const note = document.getElementById(`note-${id}`)?.value.trim();
    try {
      const r = await fetch(`/api/videos/${id}/note`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ note }),
      });
      if ((await r.json()).ok) showToast("✅ تم حفظ التعليق");
    } catch {}
  }

  /* ── Reply Modal ── */
  function switchTab(tab) {
    activeTab = tab;
    ["text","voice"].forEach(t => {
      const key = t.charAt(0).toUpperCase() + t.slice(1);
      document.getElementById("panel" + key).classList.toggle("active", t === tab);
      document.getElementById("tab"   + key).classList.toggle("active", t === tab);
    });
  }

  function openReply(phone, name) {
    replyPhone = phone; voiceData = null; voiceMime = null;
    document.getElementById("replyTo").textContent = `إلى: ${name} (+${phone})`;
    document.getElementById("replyText").value = "";
    document.getElementById("voiceFileInput").value = "";
    document.getElementById("voicePreview").style.display = "none";
    document.getElementById("voiceName").textContent = "";
    switchTab("text");
    document.getElementById("replyOverlay").classList.add("open");
    setTimeout(() => document.getElementById("replyText").focus(), 50);
  }

  function closeModal() {
    stopRecording();
    document.getElementById("replyOverlay").classList.remove("open");
  }

  async function sendReply() {
    if (activeTab === "voice") {
      if (!voiceData) return showToast("⚠️ اختر ملف صوتي أولاً");
      try {
        const d = await fetch("/api/send-voice", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: replyPhone, data: voiceData, mimetype: voiceMime }),
        }).then(r => r.json());
        if (d.ok) { showToast("✅ تم إرسال الصوت"); closeModal(); }
        else showToast("❌ " + (d.error || "فشل الإرسال"));
      } catch { showToast("❌ خطأ في الاتصال"); }
    } else {
      const text = document.getElementById("replyText").value.trim();
      if (!text) return showToast("⚠️ اكتب رسالة أولاً");
      try {
        const d = await fetch("/api/send", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: replyPhone, message: text }),
        }).then(r => r.json());
        if (d.ok) { showToast("✅ تم إرسال الرد"); closeModal(); }
        else showToast("❌ " + (d.error || "فشل الإرسال"));
      } catch { showToast("❌ خطأ في الاتصال"); }
    }
  }

  /* ── Recording ── */
  if (!navigator.mediaDevices || !window.isSecureContext) {
    document.getElementById("recordBtn").style.display = "none";
  }

  async function toggleRecord() {
    if (mediaRecorder?.state === "recording") stopRecording();
    else startRecording();
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      recordChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordChunks, { type: "audio/ogg; codecs=opus" });
        voiceMime = "audio/ogg";
        const reader = new FileReader();
        reader.onload = e => {
          voiceData = e.target.result.split(",")[1];
          document.getElementById("voicePreview").src = e.target.result;
          document.getElementById("voicePreview").style.display = "block";
        };
        reader.readAsDataURL(blob);
        document.getElementById("voiceName").textContent = `🎙️ تسجيل — ${recordSeconds}ث`;
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      recordSeconds = 0;
      document.getElementById("recordBtn").textContent = "⏹️ إيقاف التسجيل";
      document.getElementById("recordBtn").classList.add("recording");
      document.getElementById("recordTimer").style.display = "block";
      recordInterval = setInterval(() => {
        recordSeconds++;
        const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
        document.getElementById("timerDisplay").textContent = `${m}:${String(s).padStart(2, "0")}`;
      }, 1000);
    } catch { showToast("❌ تعذر الوصول للميكروفون"); }
  }

  function stopRecording() {
    if (mediaRecorder?.state === "recording") mediaRecorder.stop();
    clearInterval(recordInterval);
    document.getElementById("recordBtn").textContent = "🎙️ ابدأ التسجيل";
    document.getElementById("recordBtn").classList.remove("recording");
    document.getElementById("recordTimer").style.display = "none";
  }

  document.getElementById("voiceFileInput").addEventListener("change", function () {
    const file = this.files[0]; if (!file) return;
    voiceMime = file.type || "audio/ogg";
    document.getElementById("voiceName").textContent = `🎵 ${file.name}`;
    const reader = new FileReader();
    reader.onload = e => {
      voiceData = e.target.result.split(",")[1];
      document.getElementById("voicePreview").src = e.target.result;
      document.getElementById("voicePreview").style.display = "block";
    };
    reader.readAsDataURL(file);
  });

  /* ── Upload Modal ── */
  function openUploadModal() {
    upFiles = [];
    document.getElementById("upPhone").value = "";
    document.getElementById("upName").value  = "";
    document.getElementById("upPreview").innerHTML = "";
    document.getElementById("upProgress").style.display = "none";
    document.getElementById("upCount").textContent = "0";
    document.getElementById("uploadFileInput").value = "";
    document.getElementById("uploadOverlay").classList.add("open");
  }

  function closeUploadModal() {
    document.getElementById("uploadOverlay").classList.remove("open");
  }

  const upDrop = document.getElementById("upDropZone");
  upDrop.addEventListener("dragover",  e => { e.preventDefault(); upDrop.classList.add("drag-over"); });
  upDrop.addEventListener("dragleave", () => upDrop.classList.remove("drag-over"));
  upDrop.addEventListener("drop", e => {
    e.preventDefault(); upDrop.classList.remove("drag-over");
    addUpFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("video/")));
  });

  document.getElementById("uploadFileInput").addEventListener("change", function () {
    addUpFiles(Array.from(this.files)); this.value = "";
  });

  function addUpFiles(files) {
    files.forEach(file => {
      const mb = (file.size / (1024 * 1024)).toFixed(1);
      const idx = upFiles.length;
      upFiles.push({ file, mime: file.type || "video/mp4", data: null, name: file.name, mb });
      const reader = new FileReader();
      reader.onload = e => { upFiles[idx].data = e.target.result.split(",")[1]; };
      reader.readAsDataURL(file);
    });
    document.getElementById("upCount").textContent = upFiles.length;
    renderUpPreview();
  }

  function removeUpFile(i) {
    upFiles.splice(i, 1);
    document.getElementById("upCount").textContent = upFiles.length;
    renderUpPreview();
  }

  function renderUpPreview() {
    document.getElementById("upPreview").innerHTML = upFiles.map((f, i) => `
      <div class="up-item">
        <span>🎬</span>
        <span class="up-name">${escHtml(f.name)}</span>
        <span class="up-size">${f.mb} MB</span>
        <button class="rm" onclick="removeUpFile(${i})">✕</button>
      </div>`).join("");
  }

  async function doUpload() {
    if (!upFiles.length) return showToast("⚠️ اختر فيديو أولاً");
    if (upFiles.some(f => !f.data)) return showToast("⚠️ انتظر حتى يكتمل التحضير");
    const phone = document.getElementById("upPhone").value.trim() || "000000000";
    const name  = document.getElementById("upName").value.trim()  || "يدوي";
    const prog  = document.getElementById("upProgress");
    const btn   = document.getElementById("upSendBtn");
    prog.style.display = "block"; btn.disabled = true;
    let sent = 0, failed = 0;
    for (const f of upFiles) {
      try {
        prog.textContent = `⏳ ${sent + failed + 1}/${upFiles.length}`;
        const d = await fetch("/api/videos/upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, name, data: f.data, mimetype: f.mime }),
        }).then(r => r.json());
        if (d.ok) sent++; else failed++;
      } catch { failed++; }
    }
    prog.textContent = `✅ تم رفع ${sent}${failed ? ` · ❌ فشل ${failed}` : ""}`;
    btn.disabled = false;
    if (sent > 0) setTimeout(() => { closeUploadModal(); load(true); loadStats(); }, 1200);
  }

  /* ── Utils ── */
  function escHtml(str) {
    if (!str) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  /* ── Close on backdrop / ESC ── */
  document.getElementById("replyOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("replyOverlay")) closeModal();
  });
  document.getElementById("uploadOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("uploadOverlay")) closeUploadModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeUploadModal(); }
  });

  document.getElementById("searchPhone").addEventListener("input", () => load());

  /* ── Init ── */
  loadStats();
  load(true);

  // تحديث كل 30 ثانية — فقط إذا لم يكن فيديو يشتغل
  setInterval(() => {
    loadStats();
    if (!isAnyVideoPlaying() && !playAllActive) load();
  }, 30000);
</script>

<script src="/socket.io/socket.io.js"></script>
<script>
  const _sock = io();
  _sock.on("new_media", (data) => {
    if (data.type !== "video") return;
    showToast(`🎬 فيديو جديد من ${data.name || data.phone}`);
    loadStats();
    // تحديث القائمة فقط إذا لم يكن فيديو يشتغل
    if (!isAnyVideoPlaying() && !playAllActive) load();
  });
</script>
<footer id="app-footer"></footer>
<script src="/js/nav.js"></script>
</body>
</html>
