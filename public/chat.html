<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الشات — واتساب بوت</title>
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>

<!-- Top Navigation -->
<div class="top-nav">
  <a href="/">🏠 الرئيسية</a>
  <span class="top-nav-sep">|</span>
  <a href="/messages">📋 الرسائل</a>
  <a href="/images">📸 الصور</a>
  <a href="/voices">🎤 الصوتيات</a>
  <a href="/videos">🎬 الفيديوهات</a>
  <span class="top-nav-sep">|</span>
  <a href="/chat" class="active">💬 الشات</a>
  <a href="/qr">📲 QR</a>
  <a href="/sync">🔄 مزامنة</a>
  <span class="top-nav-sep">|</span>
  <a href="#" onclick="logout()" class="logout">🚪 خروج</a>
</div>

<div class="chat-layout">

  <!-- ══ SIDEBAR ══ -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="sidebar-tabs" style="flex:1">
          <button class="tab-btn active" id="tabAll" onclick="setTab('all')">
            الكل <span class="tab-badge" id="badgeAll">0</span>
          </button>
          <button class="tab-btn" id="tabUnread" onclick="setTab('unread')">
            للرد <span class="tab-badge" id="badgeUnread">0</span>
          </button>
        </div>
        <button class="new-chat-btn" title="محادثة جديدة برقم الهاتف" onclick="toggleNewChat()">✏️</button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-box" id="searchContact" type="text" placeholder="ابحث باسم أو رقم...">
      </div>
    </div>
    <div class="new-chat-bar" id="newChatBar">
      <input type="tel" id="newChatPhone" placeholder="أدخل رقم الهاتف مثلاً: 212600123456"
        onkeydown="if(event.key==='Enter') openByPhone()">
      <button class="nc-go"  onclick="openByPhone()">فتح</button>
      <button class="nc-can" onclick="toggleNewChat()">✕</button>
    </div>
    <div class="contacts-list" id="contactsList">
      <div class="empty-contacts">جاري التحميل...</div>
    </div>
  </div>

  <!-- ══ CHAT PANEL ══ -->
  <div class="chat-panel" id="chatPanel">

    <!-- No chat selected -->
    <div class="chat-no-selection" id="noSelection">
      <div class="icon">💬</div>
      <p>اختر محادثة من القائمة</p>
    </div>

    <!-- Chat view -->
    <div id="chatView">
      <div class="chat-header">
        <button class="back-btn" onclick="backToList()" title="رجوع">‹</button>
        <div class="avatar" id="chatAvatar">?</div>
        <div class="info">
          <div class="name"  id="chatName">—</div>
          <div class="phone" id="chatPhone">—</div>
        </div>
        <button class="header-resp-btn" onclick="openResponseModal()" title="إضافة رد مبرمج جديد">➕ رد مبرمج</button>
      </div>
      <div class="chat-tabs" id="chatTabs">
        <button class="chat-tab-btn active" onclick="setViewTab('msgs')">💬 رسائل</button>
        <button class="chat-tab-btn" onclick="setViewTab('imgs')">📸 صور</button>
        <button class="chat-tab-btn" onclick="setViewTab('vids')">🎬 فيديوهات</button>
      </div>

      <div class="messages-wrap" id="messagesWrap"></div>

      <div class="media-panel" id="imgsPanel">
        <div class="media-grid" id="imgsGrid"></div>
      </div>

      <div class="media-panel" id="vidsPanel">
        <div class="media-grid" id="vidsGrid"></div>
      </div>

      <div class="chat-input-bar" id="chatInputBar">
        <button class="send-btn attach" id="attachBtn" title="إرسال ملفات" onclick="openMediaModal()">📎</button>
        <textarea id="msgInput" rows="1" placeholder="اكتب رسالة..."
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <select id="botSelect" class="bot-select" title="اختر الرقم للإرسال">
          <option value="">🤖 تلقائي</option>
          <option value="bot1">رقم 1</option>
          <option value="bot2">رقم 2</option>
          <option value="bot3">رقم 3</option>
        </select>
        <button class="send-btn text" id="sendTextBtn" onclick="sendText()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
            <path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/>
          </svg>
        </button>
        <button class="send-btn voice" id="micBtn" title="تسجيل صوتي" onclick="toggleInlineRecord()">🎤</button>

        <div class="rec-bar" id="recBar">
          <div class="rec-dot"></div>
          <span class="rec-label">جاري التسجيل...</span>
          <span class="rec-timer" id="recTimer">0:00</span>
        </div>
        <button class="rec-cancel-btn" id="recCancelBtn" style="display:none" onclick="cancelInlineRecord()" title="إلغاء">✕</button>
        <button class="rec-send-btn"   id="recSendBtn"   style="display:none" onclick="stopAndSendRecord()" title="إرسال">✓</button>
      </div>
    </div>

  </div>
</div>

<!-- ══ Media Modal ══ -->
<div class="overlay" id="mediaOverlay">
  <div class="modal" id="mediaModal">
    <h3>📎 إرسال ملفات</h3>
    <div class="to-info" id="mediaTo"></div>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('mediaFileInput').click()">
      <div class="dz-icon">📁</div>
      <p>اسحب الملفات هنا أو اضغط للاختيار</p>
      <small>صور · فيديوهات · PDF · Word · Excel · وغيرها</small>
    </div>
    <input type="file" id="mediaFileInput" accept="*/*" multiple>
    <div class="file-grid" id="fileGrid" style="display:none"></div>
    <div id="captionRow" style="display:none;margin-top:8px;">
      <input type="text" id="mediaCaption" placeholder="أضف تعليقاً (اختياري)..."
        style="width:100%;background:#2a3942;border:none;border-radius:8px;padding:9px 12px;
               color:#e9edef;font-size:0.88rem;outline:none;direction:rtl;font-family:inherit;">
    </div>
    <div class="send-progress" id="sendProgress">
      <span id="progressText">جاري الإرسال...</span>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn btn-cancel" onclick="closeMediaModal()">إلغاء</button>
      <button class="btn btn-green"  id="mediaSendBtn" onclick="sendMedia()">
        إرسال ✉️ (<span id="fileCount">0</span>)
      </button>
    </div>
  </div>
</div>

<!-- ══ Quick Response Modal ══ -->
<div class="qr-overlay" id="qrOverlay">
  <div class="qr-modal">
    <h3>➕ إضافة رد مبرمج</h3>
    <div class="qr-field">
      <label>الكلمات المفتاحية (افصل بفاصلة)</label>
      <input type="text" id="qrKeywords" placeholder="سلام, hello, مرحبا">
    </div>
    <div class="qr-field">
      <label>نص الرد *</label>
      <textarea id="qrReply" placeholder="اكتب الرد هنا..."></textarea>
    </div>
    <div class="qr-actions">
      <button class="qr-btn-cancel" onclick="closeResponseModal()">إلغاء</button>
      <button class="qr-btn-save"   onclick="saveQuickResponse()">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/contacts.js"></script>
<script src="/js/messages.js"></script>
<script src="/js/media.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
